<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>テスト対策サイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 15px;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      margin-bottom: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .box h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .subject {
      display: block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 17px;
      margin: 12px 0;
      border-radius: 12px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
    }

    .subject:hover {
      opacity: 0.85;
    }

    .notice {
      background: #fff7ed;
      border-left: 5px solid #f97316;
      padding: 14px;
      border-radius: 5px;
    }

    .date {
      padding: 13px 5px;
      border-bottom: 1px solid #ddd;
    }

    .date:last-child {
      border-bottom: none;
    }

    .info {
      line-height: 1.8;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <h1>📚 テスト対策サイト</h1>
    <p>中学2年生 テスト対策まとめ</p>
  </header>


  <main>

    <!-- 教科 -->
    <div class="box">
      <h2>📖 教科を選択</h2>

      <a class="subject" href="kokugo.html">
        📖 国語
      </a>

      <a class="subject" href="sugaku.html">
        ➗ 数学
      </a>

      <a class="subject" href="rika.html">
        🔬 理科
      </a>

      <a class="subject" href="shakai.html">
        🌏 社会
      </a>

      <a class="subject" href="eigo.html">
        🇬🇧 英語
      </a>

    </div>


    <!-- お知らせ -->
    <div class="box">
      <h2>📝 お知らせ</h2>

      <div class="notice">
        現在準備中です。
      </div>

    </div>


    <!-- テスト日程 -->
    <div class="box">
      <h2>📅 テスト日程</h2>

      <div class="date">
        ○月○日　国語
      </div>

      <div class="date">
        ○月○日　数学
      </div>

      <div class="date">
        ○月○日　理科
      </div>

      <div class="date">
        ○月○日　社会
      </div>

      <div class="date">
        ○月○日　英語
      </div>

    </div>


    <!-- このサイトについて -->
    <div class="box">
      <h2>💡 このサイトについて</h2>

      <div class="info">
        <p>
          このサイトでは、テスト範囲や重要事項、
          練習問題などをまとめています。
        </p>

        <p>
          各教科のページからテスト対策をすることができます。
        </p>

        <p>
          みんなでテスト対策に活用しましょう！
        </p>
      </div>

    </div>

  </main>


  <!-- フッター -->
  <footer>
    <p>📚 テスト対策サイト</p>
  </footer>

</body>
</html>
